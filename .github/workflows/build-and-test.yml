name: Build and test

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-build:
    name: Build Play APK and run JVM tests
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is load-bearing, not a default worth trimming. versionName and versionCode
      # are derived from `git describe --tags` (see the versioning block in app/build.gradle.kts),
      # and actions/checkout defaults to a depth-1 clone with no tags — under which describe finds
      # nothing and `rev-list --count HEAD` returns 1, so every CI artifact would be stamped
      # 0.1.0-dev.1 / versionCode 1 regardless of what was tagged.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK 37 platform
        uses: android-actions/setup-android@v3
        with:
          # The default also installs the obsolete `tools` package, which cmdline-tools 16 no longer
          # provides, so sdkmanager exits 1.
          packages: platform-tools

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-37.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Play debug APK and run core unit tests
        run: ./gradlew --no-daemon :app:assemblePlayDebug :app:verifyPlayHasNoRootCode :core-fs:check

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: core-fs/build/reports/tests/
          if-no-files-found: ignore

  ui:
    name: Run UI tests on Android emulator
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is load-bearing, not a default worth trimming. versionName and versionCode
      # are derived from `git describe --tags` (see the versioning block in app/build.gradle.kts),
      # and actions/checkout defaults to a depth-1 clone with no tags — under which describe finds
      # nothing and `rev-list --count HEAD` returns 1, so every CI artifact would be stamped
      # 0.1.0-dev.1 / versionCode 1 regardless of what was tagged.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK 37 platform
        uses: android-actions/setup-android@v3
        with:
          # The default also installs the obsolete `tools` package, which cmdline-tools 16 no longer
          # provides, so sdkmanager exits 1.
          packages: platform-tools

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-37.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Play UI tests on API 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew --no-daemon :app:connectedPlayDebugAndroidTest

      - name: Upload UI-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-reports
          path: app/build/reports/androidTests/
          if-no-files-found: ignore

          
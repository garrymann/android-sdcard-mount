name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-37.0"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: java-kotlin
          # Kotlin cannot be extracted without compiling it, so build-mode none is not an option.
          build-mode: manual
          queries: security-extended

      # CodeQL only sees what is actually compiled in this job. A Gradle build-cache hit, a reused
      # configuration cache, or a Kotlin daemon started outside the traced process would all hide
      # sources from it, hence the flags.
      - name: Build
        run: >-
          ./gradlew --no-daemon --no-build-cache --no-configuration-cache
          -Pkotlin.compiler.execution.strategy=in-process
          :core-fs:assemble :app:assemblePlayDebug :app:assembleFossDebug

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:java-kotlin
          # Code scanning results can only be uploaded once the repository is public (or has GitHub
          # Code Security). Until then the analysis still runs, so a broken build is caught early.
          upload: ${{ github.event.repository.private && 'never' || 'always' }}

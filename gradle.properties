# Gradle daemon. Kept modest so the build works on an 8 GB Windows laptop.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# file.encoding=UTF-8 above is not cosmetic. The FAT long-filename tests build directory entries
# from Kotlin strings; on a Windows JVM without this, String.toByteArray() picks up cp1252 and the
# LFN round-trip assertions fail in a way that looks like a driver bug.

org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Kotlin compiler daemon.
kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=320m

# Without this, a failure to start the Kotlin daemon silently falls back to compiling in-process.
# On Windows that fork puts the whole classpath on the command line and hits the 32 KB limit
# (CreateProcess error=206), which surfaces as an unrelated-looking compile failure.
kotlin.daemon.useFallbackStrategy=false

android.useAndroidX=true

# AGP 9 flipped these to false by default; stated explicitly so a future AGP change is visible.
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false

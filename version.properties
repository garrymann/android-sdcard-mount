# Fallback version base. Not the source of truth.
#
# The shipped version is derived from git tags — see the "Automatic versioning" block in
# app/build.gradle.kts. Cutting a release is `git tag v1.2.3` and nothing else; neither this file
# nor build.gradle.kts is edited to bump a version.
#
# This value is used only when `git describe` has no answer:
#   * the repository carries no `v*` tag yet (true until the first release is tagged);
#   * a shallow CI clone that fetched no tags;
#   * a source archive with no .git directory, or no git binary on PATH.
#
# In those cases the build reports `<baseVersion>-dev.<commits>` with a versionCode below 100, which
# is under the code even `v0.0.1` produces — so a fallback build can never outrank a tagged release
# in Play's upload ordering. Keep this at or just below the next version you expect to tag.
baseVersion=0.1.0
